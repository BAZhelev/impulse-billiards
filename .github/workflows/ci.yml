name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  validate:
    name: Lint, Type-check, Test & Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
        name: Lint (ESLint)

      - run: pnpm run check-types
        name: Type-check (tsc)

      - run: pnpm run test
        name: Test

      - run: pnpm audit --audit-level=high
        name: Audit dependencies

  web-export:
    name: Web static export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Static export; fetches published content from the CMS at build time.
      # Requires PAYLOAD_URL (repo secret) pointing at a reachable CMS.
      - run: pnpm --filter web build
        name: Build static export (apps/web)
        env:
          PAYLOAD_URL: ${{ secrets.PAYLOAD_URL }}

  docker:
    name: Build & scan CMS image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bazhelev/impulse-billiards-cms:${{ github.sha }}
            ghcr.io/bazhelev/impulse-billiards-cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/bazhelev/impulse-billiards-cms:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
