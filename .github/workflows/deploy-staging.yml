name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, scan & deploy to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/bazhelev/impulse-billiards-cms
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}-migrate:${{ github.sha }}
            ${{ env.IMAGE }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan runner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan migrator
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}-migrate:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Sync config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          source: "compose.staging.yml,Caddyfile"
          target: "/opt/impulse-billards"

      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/impulse-billards
            export CMS_IMAGE_TAG="${IMAGE_TAG}"

            # 1. Pull the new images (the old container keeps running)
            docker compose -f compose.staging.yml pull cms
            docker compose -f compose.staging.yml --profile migrate pull migrate

            # 2. Run migrations (single-phase, before deploy — additive/backward-compatible)
            docker compose -f compose.staging.yml --profile migrate run --rm migrate

            # 3. Deploy the new image
            docker compose -f compose.staging.yml up -d

            # 4. Health check
            healthy=0
            for i in $(seq 1 12); do
              if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
                healthy=1
                break
              fi
              echo "Waiting for CMS health (${i}/12)..."
              sleep 5
            done
            if [ "${healthy}" -ne 1 ]; then
              echo "CMS failed health check"
              exit 1
            fi
