name: PR Agent

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent:
    if: contains(fromJSON('["/review", "/describe", "/improve", "/ask", "/reflect", "/update_changelog", "/add_docs"]'), github.event.comment.body)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com"
          config.model: "deepseek-v4-flash"
