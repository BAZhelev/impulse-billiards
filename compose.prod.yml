# Production deployment — Caddy + CMS + PostgreSQL (per .docs/architecture.md).
# NOTE: docs call for a separate DB VPS in production; this bundles Postgres for
# now and can be split later by pointing DATABASE_URL at an external host.
# Runtime secrets live in a `.env` file next to this compose file on the VPS
# (POSTGRES_PASSWORD, PAYLOAD_SECRET, GITHUB_PAT, GITHUB_REPO, GITHUB_REF).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cms

  cms:
    image: ghcr.io/bazhelev/impulse-billiards-cms:${CMS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      GITHUB_PAT: ${GITHUB_PAT}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_REF: ${GITHUB_REF:-main}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: ghcr.io/bazhelev/impulse-billiards-cms-migrate:${CMS_IMAGE_TAG:-latest}
    profiles: ["migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
